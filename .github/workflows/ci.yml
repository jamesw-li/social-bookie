name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Enable Corepack (honor packageManager)
        run: corepack enable

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit
